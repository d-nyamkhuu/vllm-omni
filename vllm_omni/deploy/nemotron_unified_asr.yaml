pipeline: nemotron_unified_asr
model_runner: v2
async_chunk: false
dtype: bfloat16
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 32
    max_model_len: 128
    max_num_batched_tokens: 128
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    enforce_eager: true
    gpu_memory_utilization: 0.60
    default_sampling_params:
      temperature: 0
      detokenize: false
      max_tokens: 1
